# 配置服务端口号
server:
  port: 10200

# 配置数据库的连接信息
spring:
  application:
    name: spzx-cloud-order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://120.79.247.255:3306/spzx-cloud-order?characterEncoding=UTF8
    username: root
    password: Root123!
  cloud:
#    loadbalancer:
#      nacos:
#        enabled: true #nacos提供了loadbalancer组件的负载均衡接口：具备就近机房访问能力(随机)。
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: http://120.79.247.255:8848  #注册中心
#        cluster-name: SH
#        namespace: 9bc36294-1160-447e-8595-678699d2008b #默认名称空间public,也可以指定命名空间进行注册
#        group: dev01  #默认组名称DEFAULT_GROUP
      config:
        server-addr: http://120.79.247.255:8848 #配置中心
        #namespace: 9bc36294-1160-447e-8595-678699d2008b #默认名称空间public,也可以指定命名空间进行注册
        #group: dev01  #默认组名称DEFAULT_GROUP
    # openfeign日志级别配置
    openfeign:
      client:
        config:
          default:  # 这里用default就是全局配置，如果是写服务名称，则是针对某个微服务的配置
            loggerLevel: full
            read-timeout: 2000            # 读取数据的超时时间设置为2s
            connect-timeout: 2000        # 建立连接的超时时间设置为2s
            retryer: com.atguigu.spzx.cloud.order.config.FeignClientRetryer
  #从nacos配置中心导入配置文件
  config:
    import:
      - nacos:user-dev.yml
      - nacos:user2-dev.yml
# 配置mybatis的相关信息
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  type-aliases-package: com.atguigu.spzx.cloud.order.entity
  mapper-locations: classpath:/mapper/*.xml
# 将feign包下产生的日志的级别设置为debug
logging:
  level:
    #com.atguigu.spzx.cloud.order.feign: debug
    com.atguigu: debug
pattern:
  dateformat: yyyy-MM-dd

#重名属性优先级：远程(后加载 > 先加载)  >  本地
